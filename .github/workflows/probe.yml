name: probe
# Temporary connectivity check: can GitHub-hosted runners reach kilid.com / divar.ir at all?
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: reach the sites
        run: |
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36'
          t() { printf '%-28s ' "$1"; shift; curl -s -m 25 -o /tmp/out -w '%{http_code} %{time_total}s %{size_download}B\n' -A "$ua" "$@"; }
          curl -s -m 10 https://api.ipify.org; echo " (runner ip)"
          t kilid-buy-rsc        -H 'RSC: 1' https://kilid.com/buy
          t kilid-api-page2      'https://kilid.com/api/listings?url=%2Fbuy&page=2'
          t kilid-detail-rsc     -H 'RSC: 1' https://kilid.com/detail/3649605
          t divar-detail         https://api.divar.ir/v8/posts-v2/web/gabnT2-_
          t divar-search-post    -H 'Content-Type: application/json' -H 'Origin: https://divar.ir' -H 'Referer: https://divar.ir/' -d '{"city_ids":["1"],"search_data":{"form_data":{"data":{"category":{"str":{"value":"residential-sell"}}}}}}' https://api.divar.ir/v8/postlist/w/search
